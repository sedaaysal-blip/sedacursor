<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toka Dünyası - Kadın ve Çocuk Tokaları</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">🎀 Toka Dünyası</h1>
            <nav>
                <ul>
                    <li><a href="#anasayfa" class="nav-link active" data-category="all">Ana Sayfa</a></li>
                    <li><a href="#kadin" class="nav-link" data-category="kadin">Kadın Tokaları</a></li>
                    <li><a href="#cocuk" class="nav-link" data-category="cocuk">Çocuk Tokaları</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h2>En Şık Tokalar Burada!</h2>
                <p>Kadın ve çocuk tokaları için geniş koleksiyonumuzu keşfedin</p>
            </div>
        </section>

        <section class="categories">
            <div class="container">
                <div class="category-buttons">
                    <button class="category-btn active" data-category="all">Tümü</button>
                    <button class="category-btn" data-category="kadin">Kadın Tokaları</button>
                    <button class="category-btn" data-category="cocuk">Çocuk Tokaları</button>
                </div>
            </div>
        </section>

        <section class="products">
            <div class="container">
                <div class="products-grid" id="productsGrid">
                    <!-- Ürünler JavaScript ile eklenecek -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Toka Dünyası. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
